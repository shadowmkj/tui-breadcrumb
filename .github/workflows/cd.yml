name: Manual Release & Distribution

# Only triggered manually by maintainers via GitHub Actions UI or GitHub CLI
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      publish_crates_io:
        description: 'Publish release to crates.io'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Validate Version Integrity & Create Release Tag
  # ============================================================================
  prepare-release:
    name: Validate Version & Create Release Entry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Cargo.toml Version Matches Release Tag
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          INPUT_TAG="${{ inputs.version_tag }}"
          CLEAN_TAG="${INPUT_TAG#v}"

          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Target release tag: $INPUT_TAG (normalized: $CLEAN_TAG)"

          if [ "$CARGO_VERSION" != "$CLEAN_TAG" ]; then
            echo "::error::Version mismatch! Cargo.toml specifies '$CARGO_VERSION' but release tag requested '$INPUT_TAG'."
            echo "Please ensure Cargo.toml version has been bumped and committed before releasing."
            exit 1
          fi

          echo "✅ Version verification successful: Cargo.toml ($CARGO_VERSION) matches release tag ($INPUT_TAG)."

      - name: Create or Update GitHub Release Entry
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ${{ inputs.version_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 2. Publish to Crates.io
  # ============================================================================
  publish-cargo:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    needs: [prepare-release]
    if: inputs.publish_crates_io == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
