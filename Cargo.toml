[package]
name = "tui-breadcrumb"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["shadowmkj"]
description = "A customizable, interactive hierarchical breadcrumb navigation widget for Ratatui."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shadowmkj/tui-breadcrumb"
homepage = "https://github.com/shadowmkj/tui-breadcrumb"
documentation = "https://docs.rs/tui-breadcrumb"
keywords = ["ratatui", "tui", "widget", "breadcrumb", "navigation"]
categories = ["command-line-interface", "tui", "terminal-user-interface", "ratatui"]
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "Cargo.toml",
]

[dependencies]
ratatui = { version = "0.30.2", default-features = false }
unicode-width = "0.2.2"

[dev-dependencies]
insta = { version = "1.48.0", features = ["yaml"] }
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
ratatui = { version = "0.30.2", features = ["crossterm"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
