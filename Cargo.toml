[package]
name = "tui-breadcrumbs"
version = "0.1.0"
edition = "2024"
authors = ["shadowmkj"]
description = "A customizable and interactive hierarchical breadcrumb navigation widget for Ratatui"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["ratatui", "tui", "widget", "breadcrumbs", "navigation"]
categories = ["command-line-interface", "gui"]

[dependencies]
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.2", features = ["crossterm"] }
unicode-width = "0.2.2"

[features]
crossterm = ["dep:crossterm"]

[dev-dependencies]
insta = { version = "1.48.0", features = ["yaml"] }
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
